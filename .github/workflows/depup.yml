name: depup
on:
  schedule:
    - cron: "14 14 * * *" # Runs at 14:14 UTC every day
  repository_dispatch:
    types: [depup]
  workflow_dispatch:

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Enable OIDC
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Configure signed commits
      # https://www.chainguard.dev/unchained/keyless-git-commit-signing-with-gitsign-and-github-actions
      # https://github.com/chainguard-dev/actions/commits/main/setup-gitsign
      - uses: chainguard-dev/actions/setup-gitsign@v1.7.2
      - uses: reviewdog/action-depup/with-pr@v1.6.5
        with:
          file: action.yml
          version_name: reviewdog_version
          repo: reviewdog/reviewdog
          labels: "bump:minor"
